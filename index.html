<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141c2e"><title>Darende Image Converter</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="mark">D</span><div><h1>Darende Image Converter</h1><p>Görsellerinizi cihazınızda dönüştürün</p></div></header><section class="card"><label class="drop" for="files"><strong>📷 Görsel seç</strong><small>Bir veya birden fazla fotoğraf seçebilirsiniz</small><input type="file" id="files" accept="image/*,.heic,.heif" multiple></label><div class="settings"><label>Çıktı formatı<select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label><label>Genişlik (piksel)<input type="number" id="width" value="1200" min="1" max="12000" inputmode="numeric"></label><label>Yükseklik (piksel)<input type="number" id="height" value="1200" min="1" max="12000" inputmode="numeric"></label><label class="check"><input type="checkbox" id="keep"> Oranı koru (sığdır)</label></div><button id="convert" disabled>Dönüştür</button><p id="status" role="status" aria-live="polite"></p></section><section class="card" id="inputSection" hidden><h2>Seçtiğiniz görseller <span id="count"></span></h2><div id="preview" class="grid"></div></section><section class="card" id="outputSection" hidden><h2>Dönüştürülen görseller</h2><div id="output" class="grid"></div></section><footer>Fotoğraflar sunucuya yüklenmez; işlem cihazınızda yapılır.</footer></main><script src="app.js"></script></body></html>
